<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GeoEngine | 駅東口タイル試験</title>
  <style>
    :root { font:14px system-ui,"Noto Sans JP",sans-serif; color:#ebf2f3; background:#9fb3bb; }
    * { box-sizing:border-box; }
    body { margin:0; }
    #viewport { position:fixed; inset:0; }
    canvas { display:block; }
    aside { position:absolute; z-index:2; top:12px; left:12px; width:min(360px,calc(100vw - 24px)); max-height:calc(100vh - 24px); overflow:auto; padding:15px; border-radius:12px; background:#142731ed; box-shadow:0 10px 30px #12222c66; }
    h1 { margin:0 0 8px; font-size:18px; }
    p { margin:6px 0; line-height:1.5; }
    .muted { color:#b6ccd1; font-size:12px; }
    .row { display:flex; gap:7px; flex-wrap:wrap; margin:10px 0; }
    button { border:1px solid #70a6a3; border-radius:6px; padding:7px 9px; color:white; background:#245f66; cursor:pointer; font:inherit; }
    button:hover { background:#347a81; }
    #state,#perf { white-space:pre-line; font:12px/1.5 ui-monospace,Consolas,monospace; }
    .tile { display:inline-block; padding:5px 8px; margin:3px 3px 0 0; border-radius:5px; background:#43515a; }
    .tile.loaded { background:#286a54; }
    .tile.loading { background:#916927; }
    .tile.current { outline:2px solid #d5f5e7; }
    @media(max-width:600px) { aside { max-height:55vh; } }
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
</head>
<body>
  <div id="viewport"></div>
  <aside>
    <h1>福島駅東口｜タイル読込試験</h1>
    <p class="muted">実データ200m区域を100m×100mの4タイルで表示します。AI描き直しの細部は現地未照合です。</p>
    <div class="row"><button id="tour">4タイルを自動移動</button><button id="stop">停止</button><button id="reset">開始地点へ</button></div>
    <div id="tiles"></div>
    <p id="state">タイル目録を読み込み中…</p>
    <div id="perf"></div>
    <p class="muted">ドラッグ: 回転 / ホイール: 拡大縮小 / 右ドラッグ: 移動 / 矢印キー: 地点移動。黄は読込中、緑は表示中。移動先を先読みし、離れたタイルを解放します。</p>
    <p class="muted">駅東口のみの試験版です。市全域・基準PC性能・道路標高は未検証。© OpenStreetMap contributors / ODbL 1.0 ｜ Project PLATEAU / 福島市</p>
  </aside>
  <script type="module" src="./tiled-preview.js"></script>
</body>
</html>
