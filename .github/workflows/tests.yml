name: Source and procedural tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test conversion with synthetic fixtures (full dataset not included)
        run: python -m unittest discover -s tests -p test_geoengine.py -v
  procedural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check browser modules for JavaScript syntax
        run: |
          node --check viewer/geoengine-procedural-city.js
          node --check viewer/geoengine-procedural-rules.mjs
          node --check viewer/citywide-v1.js
          node --check viewer/procedural-city-demo.js
          node --check viewer/geoengine-station-road-split.js
      - name: Test procedural road geometry without city assets
        run: node --test tests/procedural-city.test.mjs
      - name: Render synthetic demo with headless Chrome
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then echo "Chrome not found"; exit 1; fi
          python -m http.server 8767 --bind 127.0.0.1 >/tmp/geoengine-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          timeout 35s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader --use-angle=swiftshader --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8767/viewer/procedural-city-demo.html >/tmp/geoengine-browser.html 2>/tmp/geoengine-chrome.log || {
            cat /tmp/geoengine-chrome.log | tail -30; exit 1;
          }
          if ! grep -q 'data-state="rendered"' /tmp/geoengine-browser.html; then
            echo "Procedural demo did not report successful WebGL rendering"
            grep -E 'render-check|id="error"' /tmp/geoengine-browser.html | tail -10 || true
            tail -35 /tmp/geoengine-chrome.log
            exit 1
          fi
          echo "Synthetic procedural demo rendered successfully in Chrome"
  station-road-split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install isolated geometry builder dependency
        run: python -m pip install 'shapely>=2.0,<3'
      - name: Verify 100m synthetic partition and source guards
        run: python -m unittest discover -s tests -p test_station_road_split.py -v
      - name: Compile 100m builder
        run: python -m py_compile scripts/build_station_road_split.py
